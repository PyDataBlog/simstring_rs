name: Rust CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}
      artifact-prefix: ci

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool swig python3-dev simstring-bin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Cache python dependencies
        uses: actions/cache@v6
        with:
          path: |
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run and Compare Benchmarks
        run: |
          # Install python dependencies
          pip install uv
          uv venv --clear
          source .venv/bin/activate
          uv pip install simstring-fast pandas maturin tabulate psutil
          rm -rf target/wheels
          maturin build --release --locked
          uv pip install target/wheels/*.whl
          # Install ruby dependencies
          gem install simstring_pure descriptive_statistics json
          # Install julia dependencies
          julia -e 'using Pkg; Pkg.add(["SimString", "BenchmarkTools", "Statistics", "JSON"])'
          # Run benchmarks
          echo "Running and Comparing Benchmarks..."
          python benches/run_benches.py

      - name: Add benchmark results to the job summary
        run: cat BENCHMARKS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post benchmark results to PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const benchmarks = fs.readFileSync('BENCHMARKS.md', 'utf8');
            const body = `## Benchmark Results\n\n${benchmarks}`;
            const marker = '## Benchmark Results';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  ci:
    name: CI
    if: always()
    needs: [benchmark, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  release-please:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-tests:
    name: Test release ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      artifact-prefix: release

  publish_to_test_pypi:
    name: Publish to TestPyPI
    needs: [release-please, release-tests]
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/simstring-rust
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Publish to TestPyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_REPOSITORY_URL: https://test.pypi.org/legacy/
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*.whl

  publish_to_pypi:
    name: Publish to PyPI
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/simstring-rust
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_REPOSITORY_URL: https://upload.pypi.org/legacy/
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*.whl

  publish:
    name: Publish to crates.io
    needs: [release-please, release-tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" = "$RELEASE_VERSION"
          status=$(curl --silent --show-error \
            --user-agent "simstring_rs release workflow" \
            --output "$RUNNER_TEMP/crate-version.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/simstring_rust/$RELEASE_VERSION")
          case "$status" in
            200)
              echo "simstring_rust $RELEASE_VERSION is already published"
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "Unable to check crates.io version (HTTP $status)" >&2
              cat "$RUNNER_TEMP/crate-version.json" >&2
              exit 1
              ;;
          esac
